name: CI

# Hardening (plan card S7):
# - every action is pinned to a full commit SHA (a moved tag cannot change what runs);
# - the workflow token is read-only and is not left in the checkout;
# - never pull_request_target, never a self-hosted runner on this public repo;
# - npm ci installs exactly the locked versions.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, offline engine, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Secrets and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan reads the full history
      - name: Gitleaks (secrets in every commit)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
      - name: OSV-Scanner (known vulnerable packages)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.2 \
            scan --lockfile=/src/package-lock.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: npm audit (high and critical, shipped packages)
        run: npm audit --omit=dev --audit-level=high

  cypher:
    name: Cypher engine on a real Neo4j
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/paytrace-local
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p paytrace-local 'RETURN 1'"
          --health-interval 5s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: paytrace-local
      NEO4J_DATABASE: neo4j
      # CI's throwaway container stands in for both databases.
      NEO4J_DEMO_URI: bolt://localhost:7687
      NEO4J_DEMO_USERNAME: neo4j
      NEO4J_DEMO_PASSWORD: paytrace-local
      NEO4J_DEMO_DATABASE: neo4j
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed
      # A skipped suite reports "pass 0", so require passes, not just no failures.
      - name: Cypher tests
        run: |
          node --import tsx --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=cypher.tap tests/cypher/*.test.ts
          grep -Eq "^# pass [1-9]" cypher.tap
          grep -q "^# fail 0" cypher.tap
