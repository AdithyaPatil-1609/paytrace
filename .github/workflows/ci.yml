name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Lint, types, offline engine, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  cypher:
    name: Cypher engine on a real Neo4j
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/paytrace-local
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p paytrace-local 'RETURN 1'"
          --health-interval 5s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: paytrace-local
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed
      # A skipped suite reports "pass 0", so require passes, not just no failures.
      - name: Cypher tests
        run: |
          node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=cypher.tap tests/cypher.test.ts
          grep -Eq "^# pass [1-9]" cypher.tap
          grep -q "^# fail 0" cypher.tap
