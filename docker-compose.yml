# Local Neo4j for live mode, so nobody needs an Aura account.
#   docker compose up -d && npm run seed && npm run dev
# Credentials match the local block in .env.example. Local use only.
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/paytrace-local
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "paytrace-local", "RETURN 1"]
      interval: 5s
      retries: 30

volumes:
  neo4j-data:
